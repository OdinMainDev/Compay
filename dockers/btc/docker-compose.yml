version: "3.8"

services:
  bitcoind:
    image: ruimarinho/bitcoin-core:latest
    container_name: bitcoin-core
    restart: unless-stopped

    environment:
      BITCOIN_NETWORK: testnet

    command:
      -testnet
      -printtoconsole
      -server=1
      -txindex=1

      -rpcuser=vvoorrlleessaawwqqee
      -rpcpassword=strong_super_secret_password
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0

      -rpcworkqueue=64
      -rpcthreads=8

      -dbcache=4096
      -maxmempool=500
      -maxconnections=80

      -listen=1
      -discover=1

    volumes:
      - ./data:/bitcoin/.bitcoin

    ports:
      - "8332:8332"   # RPC mainnet
      - "18332:18332" # RPC testnet
