version: "3.8"

services:
  bitcoind:
    image: ruimarinho/bitcoin-core:26.0
    container_name: bitcoin-core
    restart: unless-stopped

    environment:
      BITCOIN_NETWORK: ${BITCOIN_NETWORK:-mainnet}

    command:
      -printtoconsole
      -server=1
      -txindex=1

      -rpcuser=btcuser
      -rpcpassword=strong_super_secret_password
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0

      -rpcworkqueue=64
      -rpcthreads=8

      -dbcache=4096
      -maxmempool=500
      -maxconnections=80

      -listen=1
      -discover=1

      # выбор сети
      -${BITCOIN_NETWORK}

    volumes:
      - ./data:/bitcoin/.bitcoin

    ports:
      - "8332:8332"   # RPC mainnet
      - "18332:18332" # RPC testnet
